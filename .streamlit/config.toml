# Tema do painel — paleta do app do PDAF (#ff6a00 laranja + #1f2937 grafite),
# preparada para funcionar no claro e no escuro.

[client]
# tira o menu do Streamlit (Deploy/Stop/menu) — o painel é para consulta da equipe
toolbarMode = "minimal"
showSidebarNavigation = false

[theme]
base = "light"
primaryColor = "#ff6a00"
font = "sans serif"

[theme.light]
primaryColor = "#ff6a00"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f3f5"
textColor = "#1f2937"

[theme.dark]
# laranja um pouco mais claro: sobre fundo escuro o #ff6a00 fica apagado
primaryColor = "#ff8a3d"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1f2937"
textColor = "#fafafa"
